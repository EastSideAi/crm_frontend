name: deploy-crm-selectel
# Автодеплой CRM на Selectel (crm.истсайд.рф).
# Репозиторий статический — сборки нет, отдаём файлы из корня как есть
# (ровно то, что делал Vercel: outputDirectory "."). Список --exclude ниже —
# ЕДИНСТВЕННАЯ настоящая защита: боевая выкладка идет этим tar-ом и .vercelignore
# не читает. Кладешь в репозиторий внутренний документ — добавляй его сюда,
# иначе он откроется по прямой ссылке на crm.истсайд.рф без входа.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-crm-selectel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Метка версии к app.js и style.css. Файлы отдаются под неизменными именами, и
      # браузер держал старую копию до жесткого обновления: менеджеры видели вчерашнюю
      # CRM и считали, что правка не выехала (11.08.2026). Метка меняется с каждым
      # коммитом — новый адрес, значит гарантированно свежий файл.
      - name: Проставить версию статики
        run: |
          set -eo pipefail
          V="${GITHUB_SHA::12}"
          sed -i -E 's#(src|href)="(app\.js|style\.css)"#\1="\2?v='"$V"'"#g' index.html
          grep -E '(app\.js|style\.css)\?v=' index.html || {
            echo "версия не проставилась — проверь разметку index.html"; exit 1; }

      - name: Собрать пакет для выкладки
        run: |
          set -eo pipefail
          test -f index.html || { echo "нет index.html в корне — выкладку отменяю"; exit 1; }
          mkdir -p _out
          tar -czf _out/site.tgz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./_out' \
            --exclude='./_specs' \
            --exclude='./_screens' \
            --exclude='./design' \
            --exclude='./design.md' \
            --exclude='./CLAUDE.md' \
            --exclude='./vercel.json' \
            --exclude='./.vercelignore' \
            --exclude='./docs' \
            --exclude='./WORKSPACE.md' \
            --exclude='./memory.md' \
            --exclude='./.agents' \
            --exclude='./.tmp' \
            --exclude='./_*.mjs' \
            --exclude='./_*.py' \
            --exclude='./_*.html' \
            --exclude='./fonts/*.txt' \
            -C . .
          tar -tzf _out/site.tgz | head -20

      - name: Deploy to Selectel (jailed forced-command)
        env:
          DEPLOY_HOST: ${{ secrets.SELECTEL_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SELECTEL_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.SELECTEL_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SELECTEL_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SELECTEL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Ключ привязан к одному скрипту и одной папке: утёкший ключ = максимум
          # подмена статики CRM, не сервер и не соседние фронты.
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" < _out/site.tgz
          rm -f ~/.ssh/id_deploy
