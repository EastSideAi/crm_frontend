name: deploy-crm-selectel
# Автодеплой CRM на Selectel (crm.истсайд.рф).
# Репозиторий статический — сборки нет, отдаём файлы из корня как есть
# (ровно то, что делал Vercel: outputDirectory "."). Список --exclude ниже —
# ЕДИНСТВЕННАЯ настоящая защита: боевая выкладка идет этим tar-ом и .vercelignore
# не читает. Кладешь в репозиторий внутренний документ — добавляй его сюда,
# иначе он откроется по прямой ссылке на crm.истсайд.рф без входа.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-crm-selectel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Метка версии к app.js и style.css. Файлы отдаются под неизменными именами, и
      # браузер держал старую копию до жесткого обновления: менеджеры видели вчерашнюю
      # CRM и считали, что правка не выехала (11.08.2026). Метка меняется с каждым
      # коммитом — новый адрес, значит гарантированно свежий файл.
      - name: Проставить версию статики
        run: |
          set -eo pipefail
          V="${GITHUB_SHA::12}"
          sed -i -E 's#(src|href)="(app\.js|style\.css)"#\1="\2?v='"$V"'"#g' index.html
          grep -E '(app\.js|style\.css)\?v=' index.html || {
            echo "версия не проставилась — проверь разметку index.html"; exit 1; }

      # Презентация отдела продаж выкладывается не под своим именем, а по длинному
      # случайному адресу: на слайдах ставки смен, проценты продавцов и калькулятор
      # дохода, а статика CRM отдается без входа — кто знает адрес, тот и открыл.
      # Случайный путь закрывает единственную реальную дыру: чтобы страницу нашли
      # перебором или по ссылке из поиска. Саму папку sales-intro в пакет по-прежнему
      # не кладем (см. --exclude ниже), уезжает только копия под секретным адресом.
      # Открывать ее надо строго с /index.html на конце: в Caddy у CRM стоит
      # try_files {path} /index.html, без {path}/index.html посередине — адрес папки
      # уходит в SPA-фолбэк и открывает саму CRM вместо презентации.
      - name: Разложить презентацию отдела продаж по секретному адресу
        run: |
          set -eo pipefail
          test -f sales-intro/index.html || { echo "нет sales-intro/index.html"; exit 1; }
          mkdir -p 's/02c41edba0a087'
          cp -R sales-intro/. 's/02c41edba0a087/'
          test -f 's/02c41edba0a087/index.html'

      - name: Собрать пакет для выкладки
        run: |
          set -eo pipefail
          test -f index.html || { echo "нет index.html в корне — выкладку отменяю"; exit 1; }
          mkdir -p _out
          tar -czf _out/site.tgz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./_out' \
            --exclude='./_specs' \
            --exclude='./_screens' \
            --exclude='./design' \
            --exclude='./design.md' \
            --exclude='./CLAUDE.md' \
            --exclude='./vercel.json' \
            --exclude='./.vercelignore' \
            --exclude='./docs' \
            --exclude='./WORKSPACE.md' \
            --exclude='./memory.md' \
            --exclude='./.agents' \
            --exclude='./.tmp' \
            --exclude='./files' \
            --exclude='./sales-intro' \
            --exclude='./_*.mjs' \
            --exclude='./_*.py' \
            --exclude='./_*.html' \
            --exclude='./fonts/*.txt' \
            -C . .
          # Список файлов пишем в файл и печатаем из него. Было
          # `tar -tzf ... | head -20`: head уходит после двадцатой строки, tar
          # получает закрытую трубу, падает с кодом 2, а pipefail роняет весь шаг —
          # и выкладка не доезжает, хотя пакет собран. Срабатывало как повезет,
          # 17.09.2026 не повезло: промоут уехал в main, а на сайте осталась
          # вчерашняя CRM. Чтение архива целиком заодно проверяет, что он цел.
          tar -tzf _out/site.tgz > _out/list.txt
          sed -n '1,20p' _out/list.txt
          echo "всего файлов в пакете: $(wc -l < _out/list.txt)"

      - name: Deploy to Selectel (jailed forced-command)
        env:
          DEPLOY_HOST: ${{ secrets.SELECTEL_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SELECTEL_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.SELECTEL_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SELECTEL_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SELECTEL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Ключ привязан к одному скрипту и одной папке: утёкший ключ = максимум
          # подмена статики CRM, не сервер и не соседние фронты.
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" < _out/site.tgz
          rm -f ~/.ssh/id_deploy
